<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinuha Labs</title>
<meta name="description" content="Hinuha Labs builds AI products and solutions: language models and agents, computer vision, and AI on real-world data.">
<meta property="og:title" content="Hinuha Labs">
<meta property="og:description" content="AI that reasons from your data.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hinuha-labs.github.io/">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1D1D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600&family=Funnel+Sans:wght@400;600&family=Martian+Mono:wght@500&display=swap">
<style>
:root {
  --kamagong: #111111; --sampaguita: #FFFFFF; --kapis: #F4F4F4; --abo: #5C5C5C;
  --mabolo: #7A1F2B; --makopa: #E07380;
  --mono: "Martian Mono", "Courier New", monospace;
  --head: "Familjen Grotesk", Arial, sans-serif;
  --sans: "Funnel Sans", Arial, sans-serif;

  --mist: var(--kapis); --paper: var(--sampaguita); --ink: var(--kamagong);
  --muted: var(--abo); --line: rgba(17, 17, 17, .16); --accent: var(--mabolo);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mist: var(--kamagong); --paper: #1D1D1D; --ink: var(--sampaguita);
    --muted: #B3B3B3; --line: rgba(255, 255, 255, .18); --accent: var(--makopa);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mist: var(--kamagong); --paper: #1D1D1D; --ink: var(--sampaguita);
  --muted: #B3B3B3; --line: rgba(255, 255, 255, .18); --accent: var(--makopa);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  position: relative; isolation: isolate;
  font: 400 16px/1.5 var(--sans);
  min-height: 100svh; display: flex; flex-direction: column;
}
.wrap { width: min(1200px, 100% - 2 * clamp(16px, 5vw, 64px)); margin-inline: auto; }

.sheet {
  container-type: inline-size;
  flex: 1; display: flex; flex-direction: column; padding-top: clamp(24px, 4vw, 40px);
}
#cloud { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }

.mark { display: block; flex: none; --m-line: var(--ink); --m-ring: var(--paper); --m-hub: var(--ink); }
.mark.small { --m-sw: 5; }

nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font: 500 15px/1 var(--mono); letter-spacing: -0.03em; }

.label { font: 500 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0; }

.hero {
  flex: 1; display: flex; align-items: center;
  padding-block: clamp(64px, 12cqi, 120px) clamp(120px, 14cqi, 160px);
}
.copy { max-width: 520px; }

h1 {
  font: 600 clamp(40px, 7cqi, 56px)/1.04 var(--head); letter-spacing: -0.02em;
  margin: 16px 0 20px; max-width: 12ch; text-wrap: balance;
}
.lede { font-size: 18px; margin: 0; max-width: 34ch; }

footer {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-bottom: 24px; color: var(--muted); font-size: 14px;
}
footer .brand { color: var(--ink); font-size: 13px; gap: 8px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="m8" viewBox="0 0 100 100">
    <g style="stroke-width:var(--m-sw, 3.5)">
      <path d="M17 31 V69 M17 31 L50 50 M50 12 V88 M50 12 L83 31 V69" style="fill:none;stroke:var(--m-line);stroke-linecap:round;stroke-linejoin:round"/>
      <g style="fill:var(--m-ring);stroke:var(--m-line)"><circle cx="17" cy="31" r="6"/><circle cx="17" cy="69" r="6"/><circle cx="50" cy="12" r="6"/><circle cx="50" cy="88" r="6"/><circle cx="83" cy="31" r="6"/><circle cx="83" cy="69" r="6"/></g>
      <circle cx="50" cy="50" r="9" style="fill:var(--m-hub);stroke:none"/>
    </g>
  </symbol>
</svg>

<canvas id="cloud" aria-hidden="true"></canvas>
<main class="wrap sheet">
  <nav>
    <span class="brand"><svg class="mark" width="28" height="28" aria-hidden="true"><use href="#m8"/></svg>Hinuha Labs</span>
  </nav>

  <section class="hero">
    <div class="copy">
      <p class="label">Hinuha · Filipino for “inference”</p>
      <h1>AI that reasons from your data.</h1>
      <p class="lede">We build AI products and solutions: language models and agents, computer vision, and AI on real-world data such as maps, sensors and imagery.</p>
    </div>
  </section>
</main>

<footer class="wrap">
  <span class="brand"><svg class="mark small" width="20" height="20" aria-hidden="true"><use href="#m8"/></svg>Hinuha Labs</span>
  <span>© 2026</span>
</footer>

<script>
(() => {
  const cv = document.getElementById('cloud');
  const ctx = cv.getContext('2d');
  const page = cv.parentElement;
  const still = matchMedia('(prefers-reduced-motion: reduce)');

  let seed = 1 + (Math.random() * 2147483645 | 0);   // a new layout on every load
  const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const gauss = () => Math.sqrt(-2 * Math.log(rand() || 1e-9)) * Math.cos(2 * Math.PI * rand());
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (k) => 1 - Math.pow(1 - k, 3);
  const wave = (amp) => ({ amp, w: 0.08 + rand() * 0.12, ph: rand() * 6.28 });   // slow shared drift
  const at = (v, t) => v.amp * Math.sin(t * v.w + v.ph);

  let col = {}, W = 0, H = 0, S = 0, start = 0, raf = 0, onScreen = true;
  let pts = [], groups = [], X, Y, DX, DY, VX, VY;
  let insight = null, nextInsight = 3.4, flashes = [], lastFlash = 0;
  const ptr = { x: 0, y: 0, lx: 0, ly: 0, v: 0, on: false, k: 0 };   // mouse or finger; k fades it in and out

  // The field looks like a 2-D embedding: curved strands with dense middles and sparse tails,
  // thin bridges between some of them, a few elongated cores, and a little background noise.
  // Each group has its own marker, like classes in a scatter plot.
  function makeField() {
    const n = Math.min(1100, Math.max(300, (W * H) / 900 | 0));
    const add = (g, u, off, mark) => pts.push({ g, u, off, mark, sx: rand(), sy: rand(), d: rand() * 0.6 });
    const pick = (main) => (rand() < 0.7 ? main : 'dot');
    const strand = (p0, p3, bend, th, count, main, sparse) => {
      const nx = -(p3[1] - p0[1]), ny = p3[0] - p0[0];
      const c = (k, b) => [p0[0] + (p3[0] - p0[0]) * k + nx * b, p0[1] + (p3[1] - p0[1]) * k + ny * b];
      const g = { type: 'curve', P: [p0, c(1 / 3, bend * (0.6 + rand() * 0.8)), c(2 / 3, bend * (0.6 + rand() * 0.8)), p3],
        drift: [0, 1, 2, 3].map(() => [wave(0.02 + rand() * 0.02), wave(0.02 + rand() * 0.02)]), th };
      groups.push(g);
      for (let k = 0; k < count; k++) {
        const u = sparse ? rand() : clamp(0.5 + gauss() * 0.24);
        const thick = th * (sparse ? 1 : 0.35 + 1.3 * (1 - Math.abs(u - 0.5) * 2));
        add(g, u, gauss() * thick, sparse ? 'dot' : pick(main));
      }
      return g;
    };
    const kinds = ['ink', 'dot', 'ring', 'dot', 'ink', 'cross', 'dot'];
    const ends = [];
    const nStrands = 7, per = n * 0.62 / nStrands;
    for (let s = 0; s < nStrands; s++) {
      const cx = 0.08 + rand() * 0.84, cy = 0.08 + rand() * 0.84, a = rand() * 6.28, L = 0.22 + rand() * 0.3;
      const p0 = [cx - Math.cos(a) * L / 2, cy - Math.sin(a) * L / 2], p3 = [cx + Math.cos(a) * L / 2, cy + Math.sin(a) * L / 2];
      const main = kinds[s % kinds.length];
      strand(p0, p3, (rand() - 0.5) * 0.9, 0.006 + rand() * 0.012, per * (main === 'ring' || main === 'cross' ? 0.45 : 1.1) | 0, main, false);
      ends.push(p3);
    }
    for (let b = 0; b < 3; b++) {   // thin bridges from one strand's end to another's
      const i = rand() * ends.length | 0, j = (i + 1 + (rand() * (ends.length - 1) | 0)) % ends.length;
      strand(ends[i], ends[j], (rand() - 0.5) * 0.4, 0.004, 14 + (rand() * 10 | 0), 'dot', true);
    }
    for (let c = 0; c < 3; c++) {   // elongated dense cores
      const g = { type: 'core', c: [0.1 + rand() * 0.8, 0.1 + rand() * 0.8], drift: [wave(0.03), wave(0.03)], rot: rand() * 3.14, spin: wave(0.25), sa: 0.03 + rand() * 0.035, sb: 0.008 + rand() * 0.01 };
      groups.push(g);
      const main = c === 0 ? 'ink' : 'dot', m = n * 0.06 | 0;
      for (let k = 0; k < m; k++) add(g, gauss(), gauss(), pick(main));
    }
    const noise = { type: 'noise' };
    groups.push(noise);
    while (pts.length < n) add(noise, rand(), rand(), 'dot');
    X = new Float32Array(pts.length); Y = new Float32Array(pts.length);
    DX = new Float32Array(pts.length); DY = new Float32Array(pts.length); VX = new Float32Array(pts.length); VY = new Float32Array(pts.length);
  }

  // Where each point sits in the embedding at time t (normalised 0–1 page units).
  const B = (a, b, c, d, u) => { const v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; };
  const dB = (a, b, c, d, u) => { const v = 1 - u; return 3 * v * v * (b - a) + 6 * v * u * (c - b) + 3 * u * u * (d - c); };
  function shape(g, t) {   // per-frame curve or core pose, shared by all its points
    if (g.type === 'curve') g.Q = g.P.map((p, k) => [p[0] + at(g.drift[k][0], t), p[1] + at(g.drift[k][1], t)]);
    if (g.type === 'core') { g.cx = g.c[0] + at(g.drift[0], t); g.cy = g.c[1] + at(g.drift[1], t); g.a = g.rot + at(g.spin, t); }
  }
  function home(p) {
    const g = p.g;
    if (g.type === 'noise') return [p.u * W, p.off * H];
    if (g.type === 'core') {
      const a = p.u * g.sa * S, b = p.off * g.sb * S, c = Math.cos(g.a), s = Math.sin(g.a);
      return [g.cx * W + a * c - b * s, g.cy * H + a * s + b * c];
    }
    const Q = g.Q, u = p.u;
    const x = B(Q[0][0], Q[1][0], Q[2][0], Q[3][0], u) * W, y = B(Q[0][1], Q[1][1], Q[2][1], Q[3][1], u) * H;
    const tx = dB(Q[0][0], Q[1][0], Q[2][0], Q[3][0], u) * W, ty = dB(Q[0][1], Q[1][1], Q[2][1], Q[3][1], u) * H;
    const l = Math.hypot(tx, ty) || 1;
    return [x - ty / l * p.off * S, y + tx / l * p.off * S];
  }

  const readColors = () => {
    const s = getComputedStyle(document.documentElement);
    col = { ink: s.getPropertyValue('--ink').trim(), muted: s.getPropertyValue('--muted').trim(), accent: s.getPropertyValue('--accent').trim() };
  };
  const dot = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); };
  const nearest = (i, k, R) => {
    const out = [];
    for (let j = 0; j < pts.length; j++) {
      if (j === i) continue;
      const d = (X[j] - X[i]) ** 2 + (Y[j] - Y[i]) ** 2;
      if (d < R * R && d > 64) out.push([d, j]);
    }
    return out.sort((a, b) => a[0] - b[0]).slice(0, k).map((e) => e[1]);
  };

  // An insight: a few nearby points link into a small tree, the hub turns oxblood, then it fades.
  function newInsight(t) {
    const R = Math.max(90, Math.min(220, Math.min(W, H) * 0.24));
    for (let tries = 0; tries < 30; tries++) {
      const hub = rand() * pts.length | 0;
      if (X[hub] < 40 || Y[hub] < 40 || X[hub] > W - 40 || Y[hub] > H - 40) continue;
      const want = 5 + (rand() * 3 | 0), gap = R * 0.22, near = [];
      for (const j of nearest(hub, 80, R)) {   // spread the picks out so the graph reads at a glance
        if (near.length >= want) continue;
        if ([hub, ...near].every((m) => (X[m] - X[j]) ** 2 + (Y[m] - Y[j]) ** 2 > gap * gap)) near.push(j);
      }
      if (near.length < 4) continue;
      const inTree = [hub], rest = near.slice(), links = [];
      while (rest.length) {   // grow outward from the hub, always taking the closest next point
        let best = null;
        for (const a of inTree) for (const b of rest) {
          const d = (X[a] - X[b]) ** 2 + (Y[a] - Y[b]) ** 2;
          if (!best || d < best[0]) best = [d, a, b];
        }
        links.push([best[1], best[2]]); inTree.push(best[2]); rest.splice(rest.indexOf(best[2]), 1);
      }
      return { hub, members: inTree, links, t0: t };
    }
    return null;
  }

  function flash(t) {
    if (t < 3.4 || t - lastFlash < 0.4 || flashes.length > 6) return;
    lastFlash = t;
    const i = rand() * pts.length | 0;
    const [j] = nearest(i, 1, Math.min(W, H) * 0.08);
    if (j !== undefined) flashes.push({ i, j, t0: t });
  }

  const fmt = (v) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(2);

  function draw(t, live) {
    ctx.clearRect(0, 0, W, H);
    for (const g of groups) shape(g, t);
    ptr.k += ((live && ptr.on ? 1 : 0) - ptr.k) * 0.08;
    ptr.v += (Math.hypot(ptr.x - ptr.lx, ptr.y - ptr.ly) - ptr.v) * 0.5;   // pointer speed, px per frame
    ptr.lx = ptr.x; ptr.ly = ptr.y;
    const PR = Math.max(90, Math.min(160, S * 0.18));

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      let [bx, by] = home(p);
      const k = ease(clamp((t - p.d) / 2.6));   // on load the points settle out of a random scatter, like a layout converging
      bx = p.sx * W + (bx - p.sx * W) * k; by = p.sy * H + (by - p.sy * H) * k;
      // Each point has momentum: the pointer knocks it outward (harder when the pointer moves fast),
      // never drags it along; a spring brings it home and friction stops it.
      if (live && ptr.k > 0.01) {
        const dx = bx + DX[i] - ptr.x, dy = by + DY[i] - ptr.y, d = Math.hypot(dx, dy);
        if (d < PR && d > 0.1) {
          const kick = (0.05 + ptr.v * 0.12) * (1 - d / PR) ** 2 * ptr.k;
          VX[i] += dx / d * kick; VY[i] += dy / d * kick;
        }
      }
      VX[i] = (VX[i] - DX[i] * 0.005) * 0.9; VY[i] = (VY[i] - DY[i] * 0.005) * 0.9;
      DX[i] += VX[i]; DY[i] += VY[i];
      X[i] = bx + DX[i]; Y[i] = by + DY[i];
    }

    // Plot markers: one dot size, two shades, plus rings and crosses for two classes.
    ctx.lineWidth = 1;
    for (let i = 0; i < pts.length; i++) {
      const m = pts[i].mark, a = clamp((t - pts[i].d) / 0.6), x = X[i], y = Y[i];
      if (m === 'dot') { ctx.globalAlpha = 0.6 * a; ctx.fillStyle = col.muted; dot(x, y, 1.4); ctx.fill(); }
      else if (m === 'ink') { ctx.globalAlpha = 0.9 * a; ctx.fillStyle = col.ink; dot(x, y, 1.4); ctx.fill(); }
      else if (m === 'ring') { ctx.globalAlpha = 0.9 * a; ctx.strokeStyle = col.ink; dot(x, y, 2.3); ctx.stroke(); }
      else { ctx.globalAlpha = 0.9 * a; ctx.strokeStyle = col.ink; ctx.beginPath(); ctx.moveTo(x - 2.5, y); ctx.lineTo(x + 2.5, y); ctx.moveTo(x, y - 2.5); ctx.lineTo(x, y + 2.5); ctx.stroke(); }
    }

    if (live) {
      flash(t);
      flashes = flashes.filter((f) => t - f.t0 < 1.8);
      if (!insight && t >= nextInsight) insight = newInsight(t);
      if (insight && t - insight.t0 > 6) { insight = null; nextInsight = t + 0.6; }
    }

    ctx.strokeStyle = col.ink; ctx.lineWidth = 1; ctx.lineCap = 'round';
    for (const f of flashes) {
      ctx.globalAlpha = 0.35 * Math.sin(Math.PI * clamp((t - f.t0) / 1.8));
      ctx.beginPath(); ctx.moveTo(X[f.i], Y[f.i]); ctx.lineTo(X[f.j], Y[f.j]); ctx.stroke();
    }

    if (insight) {
      const { hub, members, links, t0 } = insight, s = t - t0;
      const fade = 1 - clamp((s - 5.2) / 0.8);
      const lit = ease(clamp((s - 0.6 - links.length * 0.3) / 0.6));
      ctx.lineWidth = 1.25;
      links.forEach(([a, b], n) => {
        const k = ease(clamp((s - 0.3 - n * 0.3) / 0.45));
        if (!k) return;
        ctx.globalAlpha = 0.75 * fade;
        ctx.beginPath(); ctx.moveTo(X[a], Y[a]); ctx.lineTo(X[a] + (X[b] - X[a]) * k, Y[a] + (Y[b] - Y[a]) * k); ctx.stroke();
      });
      const show = clamp(s / 0.4) * fade;
      for (const m of members) {
        if (m === hub) continue;
        ctx.globalAlpha = show; ctx.fillStyle = col.ink; dot(X[m], Y[m], 2.4); ctx.fill();
      }
      ctx.globalAlpha = show; ctx.fillStyle = col.ink; dot(X[hub], Y[hub], 2.4 + 1.8 * lit); ctx.fill();
      if (lit) { ctx.globalAlpha = lit * fade; ctx.fillStyle = col.accent; ctx.fill(); }
    }

    // Readout: the point nearest the pointer gets a ring and its embedding coordinates.
    if (ptr.k > 0.01) {
      let best = -1, bd = 70 * 70;
      for (let i = 0; i < pts.length; i++) { const d = (X[i] - ptr.x) ** 2 + (Y[i] - ptr.y) ** 2; if (d < bd) { bd = d; best = i; } }
      if (best >= 0) {
        const x = X[best], y = Y[best];
        ctx.globalAlpha = ptr.k; ctx.strokeStyle = col.ink; ctx.lineWidth = 1.25; dot(x, y, 6); ctx.stroke();
        const label = fmt((x / W) * 6 - 3) + ', ' + fmt(3 - (y / H) * 6);
        ctx.font = '500 11px "Martian Mono", monospace'; ctx.fillStyle = col.muted;
        const w = ctx.measureText(label).width, right = x + 12 + w < W - 8;
        ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(label, right ? x + 12 : x - 12, y - 12);
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    if (!start) start = now;
    draw((now - start) / 1000, true);
    raf = onScreen && !document.hidden ? requestAnimationFrame(frame) : 0;
  }
  function drawStill() {
    draw(60, false);
    insight = insight || newInsight(57);
    draw(60, false);
  }
  function render() {
    if (still.matches) { cancelAnimationFrame(raf); raf = 0; drawStill(); }
    else if (!raf && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  }

  new ResizeObserver(() => {
    const dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight; S = Math.min(W, H);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!pts.length) makeField();
    insight = null;
    if (still.matches) drawStill();
  }).observe(page);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; render(); }).observe(cv);
  document.addEventListener('visibilitychange', render);
  still.addEventListener('change', render);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); if (still.matches) drawStill(); });

  // Hover or touch scatters nearby points; they spring back on their own.
  const place = (e) => {
    const r = cv.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top;
    if (!ptr.on) { ptr.lx = ptr.x; ptr.ly = ptr.y; ptr.on = true; }   // no jump when the pointer arrives
  };
  addEventListener('pointermove', place);
  addEventListener('pointerdown', place);
  addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') ptr.on = false; });
  addEventListener('pointercancel', () => { ptr.on = false; });
  document.documentElement.addEventListener('pointerleave', () => { ptr.on = false; });

  readColors();
  render();
})();
</script>
</body>
</html>
